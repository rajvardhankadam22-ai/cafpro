<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97736" />
      <stop offset="50%" stop-color="#B85D19" />
      <stop offset="100%" stop-color="#5C2607" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF4ED" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDE6D2" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D1104" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border / Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#FFAE73" stroke-width="4" stroke-opacity="0.35" />

  <!-- Coffee Cup & Handle Group with Shadow -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Cup Body -->
    <path
      d="M136 210 H344 C344 210 348 334 240 334 C132 334 136 210 136 210 Z"
      fill="url(#cupGrad)"
    />

    <!-- Cup Rim Top Oval -->
    <ellipse cx="240" cy="210" rx="104" ry="18" fill="#F3DFD1" />
    <ellipse cx="240" cy="210" rx="92" ry="14" fill="#421C08" />
    <!-- Golden Crema Swirl -->
    <ellipse cx="238" cy="210" rx="72" ry="10" fill="#965220" />
    <ellipse cx="234" cy="209" rx="46" ry="6" fill="#C97B3A" />

    <!-- Cup Handle -->
    <path
      d="M336 226 C374 226 398 250 398 276 C398 302 374 322 336 322"
      fill="none"
      stroke="url(#cupGrad)"
      stroke-width="26"
      stroke-linecap="round"
    />

    <!-- Cup Saucer Base -->
    <path
      d="M104 362 C104 354 120 348 240 348 C360 348 376 354 376 362 C376 376 332 386 240 386 C148 386 104 376 104 362 Z"
      fill="url(#cupGrad)"
    />
    <ellipse cx="240" cy="362" rx="124" ry="10" fill="#E8D1C0" opacity="0.6" />

    <!-- Steam Swirl 1 (Left) -->
    <path
      d="M190 170 C180 142 204 126 194 100"
      fill="none"
      stroke="url(#steamGrad)"
      stroke-width="16"
      stroke-linecap="round"
    />

    <!-- Steam Swirl 2 (Center - Tall) -->
    <path
      d="M240 172 C252 138 226 118 240 84"
      fill="none"
      stroke="url(#steamGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />

    <!-- Steam Swirl 3 (Right) -->
    <path
      d="M290 170 C280 142 304 126 294 100"
      fill="none"
      stroke="url(#steamGrad)"
      stroke-width="16"
      stroke-linecap="round"
    />

    <!-- Sparkle Star (Top Right) -->
    <path
      d="M374 94 Q374 116 396 116 Q374 116 374 138 Q374 116 352 116 Q374 116 374 94 Z"
      fill="#FFE5D0"
    />
  </g>
</svg>
